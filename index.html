<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071525">

<title>KING DIAGNOSTICS | Carte professionnelle</title>

<style>
:root {
  --navy: #071525;
  --navy-light: #142b43;
  --gold: #d6b46a;
  --white: #ffffff;
  --muted: #aab7c8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg,#020b16,#10243b);
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

.card {
  width: 100%;
  max-width: 410px;
  overflow: hidden;
  border: 1px solid rgba(214,180,106,.65);
  border-radius: 25px;
  background: linear-gradient(160deg,#142b43,#071525 75%);
  box-shadow: 0 20px 55px rgba(0,0,0,.5);
  text-align: center;
}

.top-line {
  height: 5px;
  background: linear-gradient(90deg,#9d793b,#f4d995,#9d793b);
}

.header {
  padding: 25px 20px 10px;
}

.logo {
  width: 100px;
  height: 80px;
  object-fit: contain;
  margin-bottom: 12px;
}

.company {
  color: var(--gold);
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
}

.company-subtitle {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 6px;
}

.photo-container {
  width: 145px;
  height: 145px;
  margin: 22px auto 15px;
  padding: 4px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  background: var(--navy);
}

.photo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #20364c;
}

.person-name {
  margin: 12px 15px 7px;
  font-size: 25px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.person-job {
  margin: 0 12px 7px;
  color: var(--gold);
  font-size: 15px;
  font-weight: bold;
}

.person-subtitle {
  color: var(--muted);
  font-size: 12px;
}

.separator {
  width: 65%;
  height: 1px;
  margin: 22px auto;
  background: linear-gradient(90deg,transparent,var(--gold),transparent);
}

.contact {
  padding: 0 25px;
  text-align: left;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 15px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.contact-icon {
  width: 36px;
  height: 36px;
  min-width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(214,180,106,.5);
  border-radius: 10px;
  color: var(--gold);
  font-size: 17px;
}

.contact a {
  color: white;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
  padding: 12px 23px 22px;
}

.action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 43px;
  padding: 12px 7px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  background: transparent;
  color: var(--gold);
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
}

.action.primary {
  background: linear-gradient(120deg,#d6b46a,#f1d89e);
  color: #102035;
  border: none;
}

.action:hover {
  opacity: .85;
}

.footer {
  padding: 16px;
  border-top: 1px solid rgba(214,180,106,.25);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  line-height: 1.6;
}

.footer strong {
  color: var(--gold);
}

.message {
  padding: 30px 22px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.search-box {
  padding: 28px 22px;
}

.search-box h2 {
  margin-bottom: 12px;
  color: var(--gold);
  font-size: 19px;
}

.search-box p {
  margin-bottom: 16px;
  color: var(--muted);
  font-size: 12px;
}

.search-box input {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  outline: none;
  background: #0b1b2c;
  color: white;
  font-size: 16px;
  text-align: center;
  text-transform: uppercase;
}

.search-box button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--gold);
  color: #071525;
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

@media(max-width:360px) {
  .person-name { font-size: 21px; }
  .buttons { padding-left: 15px; padding-right: 15px; }
}
</style>
</head>

<body>

<div class="card">

  <div class="top-line"></div>

  <!-- CHARGEMENT -->
  <div id="loading" class="message">
    Chargement de votre carte professionnelle...
  </div>

  <!-- RECHERCHE MANUELLE -->
  <div id="search-section" class="search-box hidden">

    <h2>KING DIAGNOSTICS</h2>

    <p>Veuillez saisir votre code personnel</p>

    <input
      id="personCode"
      type="text"
      placeholder="Exemple : KD001"
      maxlength="30"
      autocomplete="off"
    >

    <button onclick="loadPerson()">
      Afficher ma carte
    </button>

  </div>

  <!-- CARTE PERSONNELLE -->
  <div id="profile" class="hidden">

    <div class="header">

      <img
        src="logo.png"
        class="logo"
        alt="Logo KING DIAGNOSTICS"
        onerror="this.style.display='none'"
      >

      <div class="company">KING DIAGNOSTICS</div>

      <div class="company-subtitle">
        MEDICAL DIAGNOSTIC SOLUTIONS
      </div>

    </div>

    <div class="photo-container">

      <img
        id="photo"
        class="photo"
        src="photo-default.png"
        alt="Photo du collaborateur"
      >

    </div>

    <h1 id="name" class="person-name"></h1>

    <div id="job" class="person-job"></div>

    <div id="subtitle" class="person-subtitle"></div>

    <div class="separator"></div>

    <!-- COORDONNEES -->
    <div class="contact">

      <div class="contact-item" id="phone-row">

        <div class="contact-icon">☎</div>

        <a id="phone" href="#"></a>

      </div>

      <div class="contact-item" id="email-row">

        <div class="contact-icon">✉</div>

        <a id="email" href="#"></a>

      </div>

    </div>

    <!-- BOUTONS -->
    <div class="buttons">

      <a id="call-btn" class="action primary" href="#">
        ☎ Appeler
      </a>

      <a id="mail-btn" class="action" href="#">
        ✉ E-mail
      </a>

      <a
        id="website-btn"
        class="action hidden"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        🌐 Site web
      </a>

      <a
        id="facebook-btn"
        class="action hidden"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        f Facebook
      </a>

      <button
        id="save-btn"
        class="action"
        onclick="saveContact()"
      >
        + Enregistrer
      </button>

      <button
        class="action"
        onclick="shareCard()"
      >
        ↗ Partager
      </button>

    </div>

    <div class="footer">

      <strong>KING DIAGNOSTICS</strong>

      <br>

      YOUR TRUSTED DIAGNOSTIC PARTNER

    </div>

  </div>

  <!-- ERREUR -->
  <div id="error" class="message hidden"></div>

</div>


<script>

/********************************************************
 * 1. CONFIGURATION
 ********************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbwkqGbo1z2Vky9AERGPWaBxIRhbTrVQe8wkhnIjC-fyMvpTUnlegdI3iGqJxY0oylZx/exec";

let currentPerson = null;
let requestTimer = null;


/********************************************************
 * 2. OUTILS D'AFFICHAGE
 ********************************************************/

function show(id) {
  document.getElementById(id).classList.remove("hidden");
}

function hide(id) {
  document.getElementById(id).classList.add("hidden");
}

function setText(id, value) {
  document.getElementById(id).textContent = value || "";
}

function getCodeFromURL() {

  const params = new URLSearchParams(
    window.location.search
  );

  return (params.get("code") || "")
    .trim()
    .toUpperCase();

}


/********************************************************
 * 3. RECHERCHE MANUELLE
 ********************************************************/

function loadPerson() {

  const code = document
    .getElementById("personCode")
    .value
    .trim()
    .toUpperCase();

  if (!code) {
    alert("Veuillez saisir votre code personnel.");
    return;
  }

  if (!/^[A-Z0-9_-]{1,30}$/.test(code)) {
    alert("Code personnel invalide.");
    return;
  }

  fetchPerson(code);

}


/********************************************************
 * 4. CONNEXION JSONP A GOOGLE APPS SCRIPT
 ********************************************************/

function fetchPerson(code) {

  hide("profile");
  hide("search-section");
  hide("error");
  show("loading");

  // Nettoyer une ancienne requête
  if (requestTimer) {
    clearTimeout(requestTimer);
  }

  // Supprimer un ancien script JSONP
  const oldScript = document.getElementById("google-jsonp");

  if (oldScript) {
    oldScript.remove();
  }

  // Définir le callback attendu par Code.gs
  window.kingCardCallback = function(result) {

    clearTimeout(requestTimer);

    const script = document.getElementById("google-jsonp");

    if (script) script.remove();

    if (!result || result.success !== true) {

      showError(
        result && result.message
          ? result.message
          : "Collaborateur introuvable."
      );

      return;
    }

    currentPerson = result;

    displayPerson(result);

  };

  // Créer le script JSONP
  const script = document.createElement("script");

  script.id = "google-jsonp";

  script.src =
    API_URL +
    "?code=" +
    encodeURIComponent(code) +
    "&_=" +
    Date.now();

  script.onerror = function() {

    clearTimeout(requestTimer);

    showError(
      "Impossible de contacter Google Apps Script. " +
      "Vérifiez le déploiement et les autorisations."
    );

    script.remove();

  };

  // Délai de sécurité
  requestTimer = setTimeout(function() {

    script.remove();

    showError(
      "Le serveur ne répond pas. Veuillez réessayer."
    );

  }, 15000);

  document.body.appendChild(script);

}


/********************************************************
 * 5. AFFICHAGE DU PROFIL
 ********************************************************/

function displayPerson(p) {

  // Correspondance exacte avec les champs de Code.gs

  const name = p.nom || "";
  const job = p.poste || "";
  const subtitle = p.subtitle || "";
  const phone = p.telephone || "";
  const email = p.email || "";
  const website = p.site || "";
  const facebook = p.facebook || "";
  const photo = p.photo || "";

  // Nom et fonction
  setText("name", name);
  setText("job", job);
  setText("subtitle", subtitle);

  // Photo
  const photoElement = document.getElementById("photo");

  photoElement.onerror = function() {
    this.onerror = null;
    this.src = "photo-default.png";
  };

  photoElement.src = photo || "photo-default.png";

  // Téléphone
  const phoneElement = document.getElementById("phone");

  phoneElement.textContent = phone;

  phoneElement.href = phone
    ? "tel:" + phone.replace(/[^\d+]/g, "")
    : "#";

  document.getElementById("call-btn").href =
    phoneElement.href;

  document.getElementById("phone-row").style.display =
    phone ? "flex" : "none";

  document.getElementById("call-btn").style.display =
    phone ? "flex" : "none";

  // E-mail
  const emailElement = document.getElementById("email");

  emailElement.textContent = email;

  emailElement.href = email
    ? "mailto:" + email
    : "#";

  document.getElementById("mail-btn").href =
    emailElement.href;

  document.getElementById("email-row").style.display =
    email ? "flex" : "none";

  document.getElementById("mail-btn").style.display =
    email ? "flex" : "none";

  // Site web
  const websiteUrl = safeUrl(website);

  const websiteButton =
    document.getElementById("website-btn");

  if (websiteUrl) {
    websiteButton.href = websiteUrl;
    show("website-btn");
  } else {
    hide("website-btn");
  }

  // Facebook
  const facebookUrl = safeUrl(facebook);

  const facebookButton =
    document.getElementById("facebook-btn");

  if (facebookUrl) {
    facebookButton.href = facebookUrl;
    show("facebook-btn");
  } else {
    hide("facebook-btn");
  }

  // Affichage final
  hide("loading");
  hide("search-section");
  hide("error");
  show("profile");

  document.title =
    name + " | KING DIAGNOSTICS";

}


/********************************************************
 * 6. SECURISATION DES LIENS
 ********************************************************/

function safeUrl(value) {

  if (!value) return "";

  let url = String(value).trim();

  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }

  try {

    const parsed = new URL(url);

    if (
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ) {
      return parsed.href;
    }

  } catch (error) {

    return "";

  }

  return "";

}


/********************************************************
 * 7. GESTION DES ERREURS
 ********************************************************/

function showError(message) {

  hide("loading");
  hide("profile");

  const errorElement =
    document.getElementById("error");

  errorElement.textContent = message;

  show("error");
  show("search-section");

}


/********************************************************
 * 8. ENREGISTRER LE CONTACT
 ********************************************************/

function saveContact() {

  if (!currentPerson) return;

  const p = currentPerson;

  function escapeVcard(value) {

    return String(value || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");

  }

  const vcard = [

    "BEGIN:VCARD",
    "VERSION:3.0",

    "FN:" + escapeVcard(p.nom),

    "ORG:KING DIAGNOSTICS",

    "TITLE:" + escapeVcard(p.poste),

    p.telephone
      ? "TEL;TYPE=CELL:" + escapeVcard(p.telephone)
      : "",

    p.email
      ? "EMAIL:" + escapeVcard(p.email)
      : "",

    p.site
      ? "URL:" + escapeVcard(p.site)
      : "",

    "END:VCARD"

  ].filter(Boolean).join("\r\n");

  const blob = new Blob(
    [vcard],
    {type: "text/vcard;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;

  link.download =
    (p.nom || "contact")
      .replace(/[^\w-]+/g, "_") + ".vcf";

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 1000);

}


/********************************************************
 * 9. PARTAGER LA CARTE
 ********************************************************/

async function shareCard() {

  const shareData = {
    title: document.title,
    text: "Carte professionnelle KING DIAGNOSTICS",
    url: window.location.href
  };

  try {

    if (navigator.share) {

      await navigator.share(shareData);

    } else if (navigator.clipboard) {

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert("Lien de la carte copié.");

    } else {

      prompt(
        "Copiez le lien de votre carte :",
        window.location.href
      );

    }

  } catch (error) {

    if (error.name !== "AbortError") {
      alert("Impossible de partager le lien.");
    }

  }

}


/********************************************************
 * 10. ENTREE CLAVIER
 ********************************************************/

document
  .getElementById("personCode")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      loadPerson();
    }

  });


/********************************************************
 * 11. INITIALISATION NFC
 ********************************************************/

const initialCode = getCodeFromURL();

if (initialCode) {

  document.getElementById("personCode").value =
    initialCode;

  fetchPerson(initialCode);

} else {

  hide("loading");
  show("search-section");

}

</script>

</body>
</html>
