<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071525">

<title>KING DIAGNOSTICS | Carte professionnelle</title>

<style>
:root {
  --navy: #071525;
  --navy-light: #142b43;
  --gold: #d6b46a;
  --gold-light: #f5dfa5;
  --white: #ffffff;
  --muted: #aab7c8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(
      ellipse at 15% 15%,
      rgba(36,112,155,.38),
      transparent 34%
    ),
    radial-gradient(
      ellipse at 85% 80%,
      rgba(214,180,106,.20),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #020812 0%,
      #071a2d 48%,
      #102d46 100%
    );
  background-attachment: fixed;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

.card {
  width: 100%;
  max-width: 410px;
  overflow: hidden;
  border: 1px solid rgba(226,196,126,.72);
  border-radius: 27px;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(53,112,145,.30),
      transparent 42%
    ),
    linear-gradient(
      155deg,
      rgba(20,48,72,.98),
      rgba(4,17,31,.99) 72%
    );
  box-shadow:
    0 28px 75px rgba(0,0,0,.62),
    0 0 35px rgba(54,128,164,.13);
  text-align: center;
}

.top-line {
  height: 5px;
  background: linear-gradient(
    90deg,
    #8c682f,
    #f8e2a8,
    #b78b43,
    #f8e2a8,
    #8c682f
  );
  box-shadow: 0 0 18px rgba(214,180,106,.35);
}

.header {
  padding: 25px 20px 10px;
}

.logo {
  width: 100px;
  height: 80px;
  object-fit: contain;
  margin-bottom: 12px;
}

.company {
  color: var(--gold);
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
}

.company-subtitle {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 6px;
}

.photo-container {
  width: 150px;
  height: 150px;
  margin: 22px auto 15px;
  padding: 4px;
  border: 2px solid #e6c77f;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    #f5dfa5,
    #98713b,
    #f5dfa5
  );
  box-shadow:
    0 0 0 7px rgba(214,180,106,.08),
    0 0 32px rgba(214,180,106,.20);
}

.photo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #20364c;
}

.person-name {
  margin: 12px 15px 7px;
  font-size: 25px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.person-job {
  margin: 0 12px 7px;
  color: var(--gold);
  font-size: 15px;
  font-weight: bold;
}

.person-subtitle {
  color: var(--muted);
  font-size: 12px;
}

.separator {
  width: 65%;
  height: 1px;
  margin: 22px auto;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

.contact {
  padding: 0 25px;
  text-align: left;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 15px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.contact-icon {
  width: 36px;
  height: 36px;
  min-width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(214,180,106,.5);
  border-radius: 10px;
  color: var(--gold);
  font-size: 17px;
  background: rgba(255,255,255,.035);
}

.contact a {
  color: white;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
  padding: 12px 23px 22px;
}

.action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 43px;
  padding: 12px 7px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  background: rgba(255,255,255,.035);
  color: var(--gold);
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.action.primary {
  background: linear-gradient(
    120deg,
    #d6b46a,
    #f1d89e
  );
  color: #102035;
  border: none;
}

.action:hover {
  opacity: .95;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(0,0,0,.22);
}

.footer {
  padding: 16px;
  border-top: 1px solid rgba(214,180,106,.25);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  line-height: 1.6;
}

.footer strong {
  color: var(--gold);
}

.message {
  padding: 30px 22px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.hidden {
  display: none !important;
}

@media(max-width:360px) {
  .person-name {
    font-size: 21px;
  }

  .buttons {
    padding-left: 15px;
    padding-right: 15px;
  }

  body {
    padding: 12px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="top-line"></div>

  <!-- CHARGEMENT -->
  <div id="loading" class="message">
    Chargement de votre carte professionnelle...
  </div>

  <!-- CARTE PERSONNELLE -->
  <div id="profile" class="hidden">

    <div class="header">

      <img
        src="logo.png"
        class="logo"
        alt="Logo KING DIAGNOSTICS"
        onerror="this.style.display='none'"
      >

      <div class="company">
        KING DIAGNOSTICS
      </div>

      <div class="company-subtitle">
        PRODUCTION DES TDR
      </div>

    </div>

    <!-- PHOTO DU COLLABORATEUR -->
    <div class="photo-container">

      <img
        id="photo"
        class="photo"
        src="photo-default.png"
        alt="Photo du collaborateur"
      >

    </div>

    <!-- IDENTITE -->
    <h1 id="name" class="person-name"></h1>

    <div id="job" class="person-job"></div>

    <div id="subtitle" class="person-subtitle"></div>

    <div class="separator"></div>

    <!-- COORDONNEES -->
    <div class="contact">

      <div class="contact-item" id="phone-row">

        <div class="contact-icon">☎</div>

        <a id="phone" href="#"></a>

      </div>

      <div class="contact-item" id="email-row">

        <div class="contact-icon">✉</div>

        <a id="email" href="#"></a>

      </div>

    </div>

    <!-- BOUTONS DE CONTACT ET RESEAUX -->
    <div class="buttons">

      <a
        id="call-btn"
        class="action primary"
        href="#"
      >
        ☎ Appeler
      </a>

      <a
        id="mail-btn"
        class="action"
        href="#"
      >
        ✉ E-mail
      </a>

      <a
        id="website-btn"
        class="action hidden"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        🌐 Site web
      </a>

      <a
        id="facebook-btn"
        class="action hidden"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        f Facebook
      </a>

    </div>

    <!-- PIED DE CARTE -->
    <div class="footer">

      <strong>KING DIAGNOSTICS</strong>

      <br>

      YOUR TRUSTED DIAGNOSTIC PARTNER

    </div>

  </div>

  <!-- ERREUR -->
  <div id="error" class="message hidden"></div>

</div>


<script>

/********************************************************
 * 1. CONFIGURATION GOOGLE APPS SCRIPT
 ********************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbwkqGbo1z2Vky9AERGPWaBxIRhbTrVQe8wkhnIjC-fyMvpTUnlegdI3iGqJxY0oylZx/exec";

let currentPerson = null;
let requestTimer = null;


/********************************************************
 * 2. OUTILS D'AFFICHAGE
 ********************************************************/

function show(id) {
  document.getElementById(id).classList.remove("hidden");
}

function hide(id) {
  document.getElementById(id).classList.add("hidden");
}

function setText(id, value) {
  document.getElementById(id).textContent = value || "";
}


/********************************************************
 * 3. RECUPERATION DU CODE NFC
 ********************************************************/

function getCodeFromURL() {

  const params = new URLSearchParams(
    window.location.search
  );

  return (params.get("code") || "")
    .trim()
    .toUpperCase();

}


/********************************************************
 * 4. CONNEXION JSONP A GOOGLE APPS SCRIPT
 ********************************************************/

function fetchPerson(code) {

  hide("profile");
  hide("error");
  show("loading");

  // Nettoyer une ancienne requête
  if (requestTimer) {
    clearTimeout(requestTimer);
  }

  // Supprimer un ancien script JSONP
  const oldScript = document.getElementById("google-jsonp");

  if (oldScript) {
    oldScript.remove();
  }

  // Définir le callback attendu par Code.gs
  window.kingCardCallback = function(result) {

    clearTimeout(requestTimer);

    const script = document.getElementById("google-jsonp");

    if (script) {
      script.remove();
    }

    if (!result || result.success !== true) {

      showError(
        result && result.message
          ? result.message
          : "Collaborateur introuvable."
      );

      return;
    }

    currentPerson = result;

    displayPerson(result);

  };


  // Création du script JSONP
  const script = document.createElement("script");

  script.id = "google-jsonp";

  script.src =
    API_URL +
    "?code=" +
    encodeURIComponent(code) +
    "&_=" +
    Date.now();

  script.onerror = function() {

    clearTimeout(requestTimer);

    showError(
      "Impossible de contacter Google Apps Script. " +
      "Vérifiez le déploiement et les autorisations."
    );

    script.remove();

  };


  // Délai de sécurité
  requestTimer = setTimeout(function() {

    script.remove();

    showError(
      "Le serveur ne répond pas. Veuillez réessayer."
    );

  }, 15000);

  document.body.appendChild(script);

}


/********************************************************
 * 5. AFFICHAGE DU PROFIL
 ********************************************************/

function displayPerson(p) {

  // Correspondance avec les champs de Code.gs

  const name = p.nom || "";
  const job = p.poste || "";
  const subtitle = p.subtitle || "";
  const phone = p.telephone || "";
  const email = p.email || "";
  const website = p.site || "";
  const facebook = p.facebook || "";
  const photo = p.photo || "";


  // Nom et fonction
  setText("name", name);
  setText("job", job);
  setText("subtitle", subtitle);


  // Photo du collaborateur
  const photoElement = document.getElementById("photo");

  photoElement.onerror = function() {
    this.onerror = null;
    this.src = "photo-default.png";
  };

  photoElement.src = photo || "photo-default.png";


  // Téléphone
  const phoneElement = document.getElementById("phone");

  phoneElement.textContent = phone;

  phoneElement.href = phone
    ? "tel:" + phone.replace(/[^\d+]/g, "")
    : "#";

  document.getElementById("phone-row").style.display =
    phone ? "flex" : "none";

  document.getElementById("call-btn").href =
    phoneElement.href;

  document.getElementById("call-btn").style.display =
    phone ? "flex" : "none";


  // E-mail
  const emailElement = document.getElementById("email");

  emailElement.textContent = email;

  emailElement.href = email
    ? "mailto:" + email
    : "#";

  document.getElementById("email-row").style.display =
    email ? "flex" : "none";

  document.getElementById("mail-btn").href =
    emailElement.href;

  document.getElementById("mail-btn").style.display =
    email ? "flex" : "none";


  // Site web
  const websiteUrl = safeUrl(website);

  const websiteButton =
    document.getElementById("website-btn");

  if (websiteUrl) {

    websiteButton.href = websiteUrl;
    show("website-btn");

  } else {

    hide("website-btn");

  }


  // Facebook
  const facebookUrl = safeUrl(facebook);

  const facebookButton =
    document.getElementById("facebook-btn");

  if (facebookUrl) {

    facebookButton.href = facebookUrl;
    show("facebook-btn");

  } else {

    hide("facebook-btn");

  }


  // Affichage final
  hide("loading");
  hide("error");
  show("profile");

  document.title =
    name + " | KING DIAGNOSTICS";

}


/********************************************************
 * 6. SECURISATION DES LIENS
 ********************************************************/

function safeUrl(value) {

  if (!value) {
    return "";
  }

  let url = String(value).trim();

  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }

  try {

    const parsed = new URL(url);

    if (
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ) {
      return parsed.href;
    }

  } catch (error) {

    return "";

  }

  return "";

}


/********************************************************
 * 7. GESTION DES ERREURS
 ********************************************************/

function showError(message) {

  hide("loading");
  hide("profile");

  const errorElement =
    document.getElementById("error");

  errorElement.textContent = message;

  show("error");

}


/********************************************************
 * 8. INITIALISATION AUTOMATIQUE NFC
 ********************************************************/

const initialCode = getCodeFromURL();

if (initialCode) {

  fetchPerson(initialCode);

} else {

  hide("loading");

  const errorElement =
    document.getElementById("error");

  errorElement.textContent =
    "Carte non identifiée. Veuillez scanner votre carte NFC personnelle.";

  show("error");

}

</script>

</body>
</html>
